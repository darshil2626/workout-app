version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one PR; majors stay separate so each
      # gets looked at on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # jsx-a11y does not support ESLint 10 yet; revisit when it does.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
