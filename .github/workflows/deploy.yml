name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      # Pages serves project sites from /<repo>/, so the app must be built
      # with a matching base path or every asset URL 404s.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Runs against a root-based build (playwright.config.ts serves via
  # `vite preview` at /), separate from the Pages build above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: node node_modules/@playwright/test/cli.js test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
