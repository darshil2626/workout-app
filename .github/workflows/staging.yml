name: Deploy staging

# Publishes a build of any branch to a separate GitHub Pages site, so a change
# can be tried on a real phone, against a restored copy of real data, before it
# reaches the installed app. Different origin means different storage: nothing
# done on staging can touch the production install.
#
# One-time setup (see CONTRIBUTING.md):
#   1. Create an empty repo for it, e.g. <you>/workout-app-staging, and in its
#      Settings -> Pages choose "Deploy from a branch" -> gh-pages / root.
#   2. Create a fine-grained token with Contents: read and write on that repo only,
#      and save it here as the secret STAGING_DEPLOY_TOKEN.
#   3. Optionally set the repository variable STAGING_REPO if it is not named
#      <owner>/<this repo>-staging.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: false
        default: main

permissions:
  contents: read

# Staging is a single slot; a newer deploy replaces the one before it.
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      STAGING_REPO: ${{ vars.STAGING_REPO || format('{0}-staging', github.repository) }}
    steps:
      - name: Check the token is configured
        env:
          TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "STAGING_DEPLOY_TOKEN is not set; see the setup notes at the top of this workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      # No VITE_POSTHOG_KEY on purpose: staging sends no analytics.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}-staging/
          BUILD_CHANNEL: staging

      - name: Publish dist to the staging repo's gh-pages branch
        env:
          TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${STAGING_REPO}.git" site 2>/dev/null \
            || { git init -q site && git -C site checkout -q -b gh-pages \
                 && git -C site remote add origin "https://x-access-token:${TOKEN}@github.com/${STAGING_REPO}.git"; }
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Staging build of ${GITHUB_SHA::7} (${{ inputs.ref }})" || { echo "Nothing changed."; exit 0; }
          git push -q origin gh-pages
